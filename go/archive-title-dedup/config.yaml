# Configuration for archive-title-dedup.
# Run with: archive-title-dedup -config config.yaml [-dry-run]

# AWS region the table lives in.
region: us-east-1

# Archive table to update.
table_name: Archive-bxbkjhe235e3jcwcjcji5txvlm-vtdlpdev

# Collection table, queried for the identifier when a record has no
# parent_collection_identifier. Required when collection_identifier is set.
collection_table_name: Collection-bxbkjhe235e3jcwcjcji5txvlm-vtdlpdev

# Duplicate-titles report (JSON) produced from the table.
input_file: ~/Desktop/duplicate_titles_dev.json

# Only records whose item_category equals this value are modified.
item_category: federated

# Optional. Only records whose parent_collection_identifier (as listed in the
# input report) equals this value are modified. If a record has no parent
# collection, the identifier of its own collection is looked up in
# collection_table_name and compared instead. Leave empty for no filtering.
collection_identifier: vtec

# Text appended to the title. Each modified record then gets "-<index>"
# after it, where index is 1-based within its duplicate-title group.
# Example: title "Foo", suffix " dup", -> "Foo dup-1", "Foo dup-2", ...
suffix: ": Specimen"

# Number of concurrent worker goroutines.
concurrency: 10

# File where every applied change (id, old and new title) is appended, one JSON
# object per line. Rollback reads it. Defaults to title-changes.jsonl.
change_log: title-changes.jsonl

# Restore original titles from change_log instead of applying changes. Also
# enabled by the -rollback flag. Only rows whose title is still the value this
# tool set are restored. If change_log does not exist, the original titles are
# taken from input_file, using the same item_category, collection_identifier and
# suffix settings that were used to apply the changes.
rollback: true

# Report planned changes without writing. Also forced by the -dry-run flag.
dry_run: false
