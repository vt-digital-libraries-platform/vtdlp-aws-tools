# Example configuration for iiif-infoFile-modifier.
# Copy this file (e.g. `cp config.yaml myconfig.yaml`) and adjust the values
# below, then run with: iiif-infoFile-modifier -config myconfig.yaml

# AWS region the bucket lives in.
region: us-east-1

# S3 bucket containing the IIIF info.json files.
bucket: < your bucket name >

# Key prefix ABOVE the collection root. Should NOT have a leading slash; a
# trailing slash is optional (one is added automatically if missing).
# collection_identifier below supplies the final path segment, so
# collection_prefix: path/to and collection_identifier: mycollection
# together mean the S3 collection root path/to/mycollection/.
collection_prefix: path/to

# DynamoDB table name holding Collection records. Used to look up the
# collection's "id" attribute from its "identifier" attribute.
collection_table: < your Collection table name >

# DynamoDB table name holding Archive records. Used to find every archive
# whose "collection" attribute matches the collection's "id".
archive_table: < your Archive table name >

# Value to look up in collection_table's "identifier" attribute to find this
# collection. Also used as the final path segment of the collection root on
# S3: the collection root is collection_prefix + "/" + collection_identifier
# + "/". Ignored (and not required) when running with the -all CLI flag,
# which processes every Collection record with visible=true instead.
collection_identifier: mycollection

# Name of the info.json file to look for within each item's tile directory.
info_file_name: info.json

# Name of the backup file written alongside each info.json, at the same S3
# "directory" (key prefix), before any modification is made.
backup_file_name: backup_info.json

# Directory name, directly under the collection root
# (collection_prefix/collection_identifier), holding one subdirectory per
# archive's tiles. Only info.json objects at the default per-archive layout
#   <collection_prefix>/<collection_identifier>/<tiles_dir_name>/<archive_identifier>-<index>/info.json
# are read/written, and only for archive identifiers found via DynamoDB
# (collection_table/archive_table above) as belonging to this collection;
# other info.json files required by the IIIF spec (e.g. presentation
# manifests) live outside this path, are formatted differently, and must not
# be touched.
tiles_dir_name: tiles

# How many S3/DynamoDB requests to run in parallel (per-archive listing,
# and per-key download/backup/transform/upload or rollback). Defaults to 10
# if unset or <= 0.
concurrency: 10

# When true, the bucket is scanned and planned changes are reported but no
# objects are written to S3 (no backups, no modified info.json). Can also be
# forced on with the -dry-run CLI flag regardless of what is set here.
dry_run: false
